# Cross-компиляция под Windows (x86_64) с mingw-w64.
# Использование: meson setup build-win --cross-file mingw-cross.ini --buildtype=release
#
# Нужны dev-пакеты SDL3 и SDL3_ttf под mingw-w64 с файлами *.pc.
# Если они лежат не в /usr/x86_64-w64-mingw32, поправьте pkg_config_libdir ниже.

[binaries]
c = 'x86_64-w64-mingw32-gcc'
cpp = 'x86_64-w64-mingw32-g++'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
pkgconfig = 'pkg-config'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
pkg_config_libdir = '/usr/x86_64-w64-mingw32/lib/pkgconfig'
